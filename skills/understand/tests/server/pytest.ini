[pytest]
# Lane-local config for the report server tests (spec build step 2).
# Feature tags become markers; register them so --strict-markers stays usable.
markers =
    wip: scenario not implemented yet
    step-2: spec build order step 2 (report server)
    spec-6: spec unit 6
    adr-0002: ADR 0002 rules
    adr-0003: ADR 0003 rules
    integration: runs a real nginx as the current user
addopts = -p no:cacheprovider
