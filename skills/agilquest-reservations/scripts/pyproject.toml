[project]
name = "agilquest-reservations"
version = "0.1.0"
description = "Agilquest reservation portal automation"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
]

[project.scripts]
aq = "agilquest_reservations.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agilquest_reservations"]
